name: Deploy Pocket Arcade to Pages

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions: {}

# Finish a deployment already in progress; queue the latest source revision.
concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # Works with master, main, or a renamed default branch. Never publish a feature branch.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Read Pages configuration
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: false
      - run: npm ci
      - run: npm test
      - name: Build and validate static artifact
        run: npm run build
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
